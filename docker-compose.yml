# Settings shared by every service that runs the scanner.
x-app-env: &app-env
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: wash_detector
  DATABASE_USER: wash_user
  DATABASE_PASSWORD: wash_pass
  DATABASE_SSL_MODE: disable
  LOG_LEVEL: INFO
  ML_MODEL_PATH: /app/models/ml_model.pkl
  ETH_RPC_URL: ${ETH_RPC_URL:?ETH_RPC_URL must be set to a real RPC endpoint}
  COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
  BOT_ALLOWLIST: ${BOT_ALLOWLIST:-}

services:
  postgres:
    image: postgres:15-alpine
    container_name: wash_detector_db
    environment:
      POSTGRES_USER: wash_user
      POSTGRES_PASSWORD: wash_pass
      POSTGRES_DB: wash_detector
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wash_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The API server and web panel (the image's default command). Published on
  # the host's loopback only. Inside the container the server binds all
  # interfaces, which it allows only with authentication: generate a key with
  # `docker compose run --rm audit wash-genkey` and set API_KEY_HASHES.
  api:
    build: .
    container_name: wash_detector_api
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_AUTH_ENABLED: "true"
      # Required by the server here (it refuses to start without keys and says
      # so in its log); optional for compose, so the audit service still runs.
      API_KEY_HASHES: ${API_KEY_HASHES:-}
      # Pools watched around the clock and where alerts go (docs/alerting.md).
      MONITOR_POOLS: ${MONITOR_POOLS:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_SMTP_TLS: ${ALERT_SMTP_TLS:-starttls}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot commands, never started by `docker compose up` and never
  # restarted (an audit under restart: unless-stopped re-ran forever):
  #   docker compose run --rm audit wash-audit --chain-id 1 --pool 0x...
  audit:
    build: .
    profiles: ["tools"]
    environment: *app-env
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: ["wash-audit", "--help"]
    restart: "no"

volumes:
  postgres_data:
