name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # NOTE: this only *reports* unsigned/unverifiable commits; it cannot hard-fail
      # the pipeline because the runner has no trust anchor (no imported GPG keys for
      # authorized committers), so git verify-commit reports "No public key" for every
      # commit including genuinely signed ones. Wire up an allowed-signers keyring and
      # flip this to a hard gate once real trusted keys are provisioned.
      - name: report commit signature status
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            UNVERIFIED=$(git log --format='%H' "${{ github.event.before }}..${{ github.sha }}" | while read -r c; do
              git verify-commit "$c" >/dev/null 2>&1 || echo "$c"
            done)
            if [ -n "$UNVERIFIED" ]; then
              echo "::notice::Commits without a verifiable signature (no trusted key configured on this runner): $UNVERIFIED"
            fi
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT

      # For pull_request events the checkout only fetches the PR ref, so a bare
      # branch name like "main" doesn't resolve locally; use the event's own
      # base/head SHAs instead (falls back to a full-history diff on push events,
      # where github.event.before is empty on a branch's first push).
      - uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified

      - name: check forbidden files
        run: |
          for pattern in '\.env$' '\.pem$' '\.key$' 'credentials' 'secret' 'password' '\.p12$' '\.pfx$'; do
            FOUND=$(git ls-files | grep -iE "$pattern" || true)
            if [ -n "$FOUND" ]; then
              echo "forbidden pattern: $pattern"
              echo "$FOUND"
              exit 1
            fi
          done

  dependency-audit:
    needs: pre-check
    if: needs.pre-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install dependencies (hash-locked)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      # A gate: fails on any known vulnerability in the installed environment
      # (the locked dependencies plus the tooling CI runs). The project itself
      # is not on PyPI and is skipped.
      - name: pip-audit
        run: pip-audit --skip-editable

      - name: pip-audit report
        if: always()
        run: pip-audit --skip-editable --format=json --output=pip-audit.json || true

      - name: generate sbom
        run: |
          cyclonedx-py environment --output-format json --output-file sbom.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: |
            pip-audit.json
            sbom.json
          retention-days: 90

  static-analysis:
    needs: pre-check
    if: needs.pre-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install dependencies (hash-locked)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      # Every step below is a gate: a finding fails the job. (Formatting and
      # lint fixes are the author's to make -- `make format` -- not CI's to
      # commit.)
      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy (strict, from pyproject.toml)
        run: mypy .

      - name: bandit
        run: bandit -c pyproject.toml -r api config core evaluation migrations models scripts

      - name: bandit report
        if: always()
        run: bandit -c pyproject.toml -r api config core evaluation migrations models scripts -f json -o bandit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: bandit.json
          retention-days: 90

  test:
    needs: [dependency-audit, static-analysis]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install project (hash-locked)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: run tests
        # Settings() is a required-field pydantic model instantiated at import time,
        # so merely collecting the test modules needs these present. Values are
        # test-only placeholders - nothing here talks to a real database or chain;
        # every test that touches Storage/web3 mocks them out.
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_NAME: wash_detector_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test-password-not-a-secret
          DATABASE_SSL_MODE: disable
          ETH_RPC_URL: http://localhost:8545
        run: |
          pytest tests/ \
            -v \
            --cov=core \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  integration:
    needs: [dependency-audit, static-analysis]
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest (multi-arch index of postgres:16, 2026-10-28), in line
        # with the SHA-pinning used for actions in this workflow.
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-password-not-a-secret
          POSTGRES_DB: wash_detector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d wash_detector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        # The shared rate-limit store (RATE_LIMIT_REDIS_URL). Pinned by digest
        # (multi-arch index of redis:7.4, 2026-11-19).
        image: redis:7.4@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install project (hash-locked)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: run integration tests
        # Real PostgreSQL and Redis (services above); the chain and price API
        # are served by a fake over local HTTP, so no external network access is
        # needed. With --integration an unreachable database is an error, never
        # a skip.
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_NAME: wash_detector_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test-password-not-a-secret
          DATABASE_SSL_MODE: disable
          ETH_RPC_URL: http://localhost:8545
          REDIS_URL: redis://localhost:6379/15
        run: |
          # Acceptance for the schema migrations: the documented command builds
          # the schema from an empty database...
          alembic upgrade head
          alembic current | grep -q "(head)"
          # ...and the tests (which start from empty again) pin it to the models.
          pytest tests/integration --integration -v

  detection-quality:
    # Phase 2 regression gate: re-measures every detector on the recorded real
    # pools and labelled scenarios (evaluation/, deterministic, no network), and
    # fails if F1, recall or the clean-pool false-positive rate regressed against
    # evaluation/baseline.json, or if config/detector_calibration.json no longer
    # matches what the detectors measure.
    needs: [dependency-audit, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install project (hash-locked)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: wash-eval --check
        env:
          DATABASE_HOST: localhost
          DATABASE_NAME: unused
          DATABASE_USER: unused
          DATABASE_PASSWORD: unused-not-a-secret
          DATABASE_SSL_MODE: disable
        run: wash-eval --check

  build:
    needs: [test, integration, detection-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker/OCI image references must be lowercase; github.repository preserves
      # the repo's actual case ("Yog-Sotho/Wash-Trade-Scanner"), so computing this
      # once here and reusing it (rather than lowercasing independently wherever
      # a tag is needed) keeps the built image and the trivy scan target in sync.
      - name: compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned to v0.35.0 by full commit SHA (not @master or a mutable tag) —
      # trivy-action tags <=0.34.2 were compromised in a March 2026 supply-chain
      # attack; 0.35.0 is the confirmed-safe, immutable-release-protected version.
      # A gate: any HIGH or CRITICAL vulnerability with a fix available fails
      # the build (bump the base digest or pin the fixed package in the
      # Dockerfile). Unfixed ones are reported in the SARIF upload below.
      - name: trivy gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: trivy report
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
